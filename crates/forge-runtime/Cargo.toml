[package]
name = "forge-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Forge agent adapters and subprocess supervision"

[dependencies]
forge-core.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
serde_json.workspace = true
chrono.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# Windows process ownership: creation-time identity (A01) and Job Objects with
# KILL_ON_JOB_CLOSE (A03). The crate is already in the workspace lock file via
# transitive dependencies, so this adds no new download.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true
